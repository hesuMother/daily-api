services:
  lightpanda:
    # Official nightly pinned to the image exercised by the smoke test.
    image: ${LIGHTPANDA_IMAGE:-lightpanda/browser@sha256:2d29d32d5ae76771096e2e9ecf46d30947ea58f9966cd2235cf4526657a029d2}
    restart: unless-stopped
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--obey-robots", "--http-nav-delay", "1000", "--http-max-response-size", "10485760", "--log-level", "fatal"]
    ports:
      - "127.0.0.1:${LIGHTPANDA_PORT:-9222}:9222"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:18-alpine   # 2026-09 기준 최신 안정 버전 (19는 아직 베타)
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      # 최초 initdb 시에만 적용됨 (볼륨이 이미 있으면 무시됨)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # 로컬 개발용 실행 옵션. 운영 환경에선 서버 스펙에 맞게 다시 튜닝 필요.
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=200"   # 200ms 넘는 쿼리 로그 (느린 쿼리 탐지용)
      - "-c"
      - "timezone=Asia/Seoul"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
